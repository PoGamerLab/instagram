<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script>
(function () {
  var s = window.SITE || {};
  var c = s.colors || {};
  ["bg", "text", "accent", "card"].forEach(function (k) {
    if (c[k]) document.documentElement.style.setProperty("--" + k, c[k]);
  });
  document.body.className = s.layout || "insta";
  document.title = (s.name || "Profile") + (s.headline ? " - " + s.headline : "");

  var app = document.getElementById("app");
  function el(tag, cls, text, parent) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    (parent || app).appendChild(e);
    return e;
  }
  function section(id, title) {
    var sec = el("section");
    if (id) sec.id = id;
    el("h2", null, title, sec);
    return sec;
  }

  // Header
  var hero = el("header", "hero");
  if (s.photo) {
    var img = el("img", "avatar", null, hero);
    img.src = s.photo;
    img.alt = s.name || "Profile photo";
    img.onerror = function () { img.remove(); };
  }
  var who = el("div", "who", null, hero);
  el("h1", null, s.name || "Your Name", who);
  if (s.headline) el("p", "headline", s.headline, who);

  // Chat-style greeting (used by the WhatsApp layout)
  if (s.greeting) el("p", "bubble", s.greeting);

  // Buttons
  if (s.buttons && s.buttons.length) {
    var nav = el("nav", "links");
    s.buttons.forEach(function (b, i) {
      var a = el("a", "btn" + (i === 0 ? " primary" : ""), b.label, nav);
      a.href = b.url;
      if (/^https?:/.test(b.url)) { a.target = "_blank"; a.rel = "noopener"; }
    });
  }

  // About
  if (s.about) el("p", "about", s.about);

  // Services
  if (s.services && s.services.length) {
    var sv = section("services", s.servicesTitle || "Services");
    var ul = el("ul", "services", null, sv);
    s.services.forEach(function (it) {
      var li = el("li", null, null, ul);
      var left = el("div", null, null, li);
      el("span", null, it.title, left);
      if (it.note) el("span", "note", it.note, left);
      if (it.price) el("span", "price", it.price, li);
    });
  }

  // Gallery
  if (s.gallery && s.gallery.length) {
    var g = section("work", s.galleryTitle || "Work");
    var grid = el("div", "grid", null, g);
    s.gallery.forEach(function (it) {
      var im = el("img", null, null, grid);
      im.src = it.src;
      im.alt = it.alt || "";
      im.loading = "lazy";
      im.onerror = function () { im.remove(); };
    });
  }

  // Hours
  if (s.hours) {
    var h = section("hours", s.hoursTitle || "Hours");
    el("p", null, s.hours, h);
  }

  if (s.footer) el("footer", null, s.footer);
})();
</script>
</body>
</html>
